name: Arabic Investor Landing Visual QA

on:
  push:
    branches:
      - ui/ar-investor-landing-alignment
  pull_request:
    branches:
      - main
    paths:
      - investor/ar/index.html
      - .github/workflows/ar-investor-visual-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/ironic-health-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/investor/ar/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ironic-health-server.log
          exit 1

      - name: Test responsive layouts and capture screenshots
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const target = 'http://127.0.0.1:4173/investor/ar/index.html';
          const viewports = [
            { name: 'mobile-small-320x568', width: 320, height: 568 },
            { name: 'mobile-390x844', width: 390, height: 844 },
            { name: 'tablet-768x1024', width: 768, height: 1024 },
            { name: 'laptop-1366x768', width: 1366, height: 768 },
            { name: 'desktop-1440x900', width: 1440, height: 900 },
            { name: 'desktop-wide-1920x1080', width: 1920, height: 1080 },
            { name: 'tv-4k-3840x2160', width: 3840, height: 2160 }
          ];

          (async () => {
            fs.mkdirSync('visual-qa', { recursive: true });
            const browser = await chromium.launch({ headless: true });
            const report = {
              target,
              generatedAt: new Date().toISOString(),
              financialCopy: {},
              linkChecks: [],
              viewports: []
            };
            let failed = false;

            const linkContext = await browser.newContext();
            const linkPage = await linkContext.newPage();
            const linkErrors = [];
            linkPage.on('pageerror', error => linkErrors.push(String(error)));
            await linkPage.goto(target, { waitUntil: 'networkidle' });

            report.financialCopy = await linkPage.evaluate(() => ({
              currentRoundVisible: document.body.innerText.includes('EGP 3,000,000'),
              nextRoundVisible: document.body.innerText.includes('USD 1.5 million Seed'),
              incorrectOpenSeedCopyPresent: document.body.innerText.includes('جولة Seed مفتوحة')
            }));

            const hrefs = await linkPage.locator('a[href]').evaluateAll(nodes =>
              [...new Set(nodes.map(node => node.href))]
            );
            for (const href of hrefs) {
              const url = new URL(href);
              if (url.protocol === 'mailto:' || url.protocol === 'tel:') {
                report.linkChecks.push({ href, status: 'scheme-ok' });
                continue;
              }
              if (url.origin !== new URL(target).origin) {
                report.linkChecks.push({ href, status: 'external-skipped' });
                continue;
              }
              url.hash = '';
              const response = await linkContext.request.get(url.toString());
              report.linkChecks.push({ href, status: response.status() });
              if (!response.ok()) failed = true;
            }
            if (linkErrors.length) failed = true;
            await linkContext.close();

            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                reducedMotion: 'reduce'
              });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              const requestFailures = [];

              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('requestfailed', request => {
                if (request.url().startsWith('http://127.0.0.1:4173')) {
                  requestFailures.push({
                    url: request.url(),
                    error: request.failure()?.errorText || 'unknown'
                  });
                }
              });

              const response = await page.goto(target, { waitUntil: 'networkidle' });
              const consentDecline = page.locator('.irc-decline');
              if (await consentDecline.isVisible().catch(() => false)) {
                await consentDecline.click();
              }

              let mobileMenuWorks = null;
              let languageSwitcherWorks = null;
              if (viewport.width <= 900) {
                const toggle = page.locator('.nav-mobile-toggle');
                mobileMenuWorks = await toggle.isVisible();
                if (mobileMenuWorks) {
                  await toggle.click();
                  mobileMenuWorks = await page.locator('.mobile-nav').isVisible();
                  await toggle.click();
                }
              } else {
                const languageButton = page.locator('.lang-btn');
                languageSwitcherWorks = await languageButton.isVisible();
                if (languageSwitcherWorks) {
                  await languageButton.click();
                  languageSwitcherWorks = await page.locator('.lang-dropdown').isVisible();
                  await languageButton.click();
                }
              }

              const metrics = await page.evaluate(() => {
                const root = document.documentElement;
                const images = [...document.images];
                return {
                  lang: root.lang,
                  dir: root.dir,
                  viewportWidth: window.innerWidth,
                  documentWidth: root.scrollWidth,
                  horizontalOverflow: root.scrollWidth > window.innerWidth + 1,
                  navPresent: Boolean(document.querySelector('.nav')),
                  footerPresent: Boolean(document.querySelector('.footer')),
                  brokenImages: images
                    .filter(image => !image.complete || image.naturalWidth === 0)
                    .map(image => image.currentSrc || image.src),
                  heading: document.querySelector('h1')?.innerText.trim() || ''
                };
              });

              const result = {
                ...viewport,
                httpStatus: response?.status() || null,
                ...metrics,
                mobileMenuWorks,
                languageSwitcherWorks,
                consoleErrors,
                pageErrors,
                requestFailures
              };
              report.viewports.push(result);

              if (
                response?.status() !== 200 ||
                metrics.lang !== 'ar' ||
                metrics.dir !== 'rtl' ||
                metrics.horizontalOverflow ||
                metrics.brokenImages.length ||
                !metrics.navPresent ||
                !metrics.footerPresent ||
                consoleErrors.length ||
                pageErrors.length ||
                requestFailures.length ||
                mobileMenuWorks === false ||
                languageSwitcherWorks === false
              ) {
                failed = true;
              }

              await page.screenshot({
                path: `visual-qa/${viewport.name}.png`,
                fullPage: false
              });

              if (viewport.name === 'mobile-390x844' || viewport.name === 'desktop-1440x900') {
                await page.screenshot({
                  path: `visual-qa/${viewport.name}-full-page.png`,
                  fullPage: true
                });
              }
              await context.close();
            }

            if (
              !report.financialCopy.currentRoundVisible ||
              !report.financialCopy.nextRoundVisible ||
              report.financialCopy.incorrectOpenSeedCopyPresent
            ) {
              failed = true;
            }

            fs.writeFileSync('visual-qa/qa-report.json', JSON.stringify(report, null, 2));
            await browser.close();
            if (failed) process.exitCode = 1;
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-investor-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
